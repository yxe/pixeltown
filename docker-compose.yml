services:
  app:
    build: ./server
    image: pixeltown-go-app
    container_name: pixeltown-app
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://pixeltown:pixeltown@db:5432/pixeltown?sslmode=disable
    volumes:
      - ./server:/app
      - go_pkg:/go/pkg
      - go_build:/root/.cache/go-build
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: pixeltown-db
    environment:
      - POSTGRES_USER=pixeltown
      - POSTGRES_PASSWORD=pixeltown
      - POSTGRES_DB=pixeltown
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  pg_data:
  go_pkg:
  go_build:
